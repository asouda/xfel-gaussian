# One configuration for both peak models.
# Paths are relative to this file.

#map: ../data/Jimin_omitOEC_refined_Nov6.map
map: ../data/Jimin_Nov6/9z35_ConfA_refmac2_omitOEX_hires.map

sequential_peaks:
    output_prefix: ../results/9z35_ConfA_refmac2_omitOEX_hires_full_covariance_4-10
    n_peaks: 10                # Maximum number of peaks to find.
    threshold_sigma: 1.0      # Stop when the strongest remaining peak is below this multiple of the robust scale of the original map.
    fit_radius: 1.5           # Radius of the Gaussian fit.
    sigma_min: 0.1            # Minimum width of the Gaussian fit.
    sigma_max: 2.0            # Maximum width of the Gaussian fit.
    max_shift: 1.2            # When fix_centers is false: maximum center shift from the seed, in Å.
    min_separation: 1.0       # Radius in Å of the exclusion sphere around a seed after each attempt.
    save_steps: false         # Save the steps of the algorithm to a file.
    fix_centers: true         # Hold each center on the seed instead of refining it.
    method: spherical         # full_covariance, isotropic, or spherical.
    zero_baseline: true       # Hold each Gaussian baseline at zero. False fits a baseline at every peak.
    neighborhood_size: 7      # Odd side length of the index neighborhood around a local maximum. 3 means 3x3x3.
    spline_seed: false        # Place the seed at the maximum of a spline interpolant of that neighborhood.
    spline_order: 3           # Order of that spline when spline_seed is true. 3 is cubic. Allowed values are 0 through 5.
    subtraction_radius: null  # Radius in Å inside which each fitted Gaussian is removed. Null uses five times that Gaussian's longest principal width.
    n_on_original: 4          # Fit this many peaks on the original density, then remove them together. Later peaks are fitted on the residual and removed one at a time. 1 subtracts after every peak.
    save_gaussians: true      # Write one CCP4 map per fitted Gaussian, named {prefix}_gaussian01.map and so on.
