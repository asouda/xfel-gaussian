[project]
name = "xfel-gaussian"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Soudackov", email = "asoudakov@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gemmi>=0.7.5",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
xfel-gaussian = "xfel_gaussian:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
